  - name: Phase 8 — Quotes, lock, and alerts
    epics:
      - id: FS-030
        status: done
        title: Quote probe, biometric key wrap, rating prefs, and backup export
        overview:
          problem: >-
            Recovery codes could not be copied while FLAG_SECURE is on. Mark-to-market
            buys and watchlist adds stored tickers with no close. CSV import had no
            chance to fix quote symbols. One Alpha Vantage key was spent re-fetching
            fresh names. Export backup crashed on tap (PBKDF2 on main, SAF launch).
            Biometrics confirmed presence but did not unwrap the SQLCipher key after a
            cold start. Rating notifications fired on any change instead of per-name
            selected levels.
          goal: >-
            Copy recovery with a 60s clipboard clear. Probe mark-to-market buys and
            watchlist adds; CSV always persists lots after an editable quote-symbol
            review. Skip as-of-fresh quotes and request oldest-first on one AV key.
            Encrypt backups off the main thread and launch the document picker from
            Compose. Add a biometric Keystore wrap of the DB key (PIN fallback;
            enrollment change reseals). Per-holding and per-watchlist rating sets
            with defaults Sell/Strong Sell vs Buy/Strong Buy; missing row uses
            defaults, stored empty set notifies none; edge-triggered. This changes
            FS-027's cold-start biometric rule.
        architecture:
          target: Quote probe, Room v7 rating_alert, biometric wrap, backup v3
          modules:
            - domain/src/main/kotlin/com/pirlruc/finsilo/domain/usecase
            - domain/src/main/kotlin/com/pirlruc/finsilo/domain/market
            - app/src/main/java/com/pirlruc/finsilo/ui
            - app/src/main/java/com/pirlruc/finsilo/data
        acceptance_criteria:
          - Recovery copy icon sits beside the code on setup, wrap-upgrade, and rotate; clipboard clears at 60s
          - New mark-to-market buys and watchlist adds refuse when the feed has no close
          - CSV import never drops lots; review can edit quote symbols and warns
          - Sync skips names whose last bar date is as-of and orders remaining oldest-first
          - Export backup does not crash on tap; written status is after the URI write
          - Cold start can unwrap via biometrics; PIN and recovery remain; enrollment change asks for PIN
          - Rating alerts use per-name sets, defaults, empty=none, and edge trigger
        guardrail_refs:
          - KT-SEC-001
          - KT-TEST-001
          - KT-CPLX-001
        tasks:
          - id: FS-030-T1
            status: done
            title: Recovery copy, quote probe, AV skip-fresh, backup export, biometric wrap, rating prefs
            instructions:
              files:
                - app/src/main/java/com/pirlruc/finsilo/ui/lock
                - app/src/main/java/com/pirlruc/finsilo/ui/settings
                - app/src/main/java/com/pirlruc/finsilo/ui/importcsv
                - app/src/main/java/com/pirlruc/finsilo/ui/dashboard
                - app/src/main/java/com/pirlruc/finsilo/ui/watchlist
                - app/src/main/java/com/pirlruc/finsilo/data/security
                - domain/src/main/kotlin/com/pirlruc/finsilo/domain
            verification:
              - ./gradlew :domain:test :domain:koverVerify
              - ./gradlew :app:testDebugUnitTest :app:lintDebug

      - id: FS-031
        status: done
        title: Persist first-purchase history, range dashboard loads, and hybrid lock
        overview:
          problem: >-
            Sync wrote at most 400 bars per asset and never deleted older rows,
            so loads grew without matching first-purchase history. The dashboard
            always materialized every market row even when the NAV chip was 1M.
            UI relock left the SQLCipher key in RAM so night sync could run;
            immediate eviction would skip that sync. Product choice after FS-030.
          goal: >-
            Persist every daily close from each holding’s first purchase (BUY, else
            first lot date). Do not prune or step stored bars, and do not thin the
            NAV chart: one holding is about 0.06–0.1 MB per year in SQLite (TEXT
            dates and BigDecimal closes), so a 20-name book held 10 years is tens
            of MB, not a reason to drop dailies. SMA-200 and NAV rebuild need
            consecutive stored closes. Dashboard reads NAV and market
            rows for the selected chip (1M / 3M / YTD / All). Lock is hybrid:
            overlay PIN immediately; after 15 minutes still in the background,
            close Room and wipe the session key. Returning to the PIN screen
            before that keeps the session. Night sync no-ops once evicted.
        architecture:
          target: Full first-purchase daily history, range-scoped dashboard reads, 15-minute hybrid eviction
          modules:
            - app/src/main/java/com/pirlruc/finsilo/data
            - app/src/main/java/com/pirlruc/finsilo/data/security
            - app/src/main/java/com/pirlruc/finsilo/ui/lock
            - domain/src/main/kotlin/com/pirlruc/finsilo/domain/usecase
        acceptance_criteria:
          - Sync/probe persist bars on/after first purchase; pre-purchase feed rows are not stored; no 400-bar cap
          - Stored dailies are never deleted or stepped by date, count, or chart cap (size is not material; SMA/NAV need consecutive closes)
          - NAV chart draws every daily in the selected range; it does not increase periodicity after a year
          - Dashboard load uses market/NAV rows from the selected HistoryRange (All still from first lot)
          - Daily sync does not triple-load the full snapshot
          - Overlay lock is immediate except during a picker or biometric sheet; SQLCipher still evicts after 15 minutes in the background unless the process returns first
        guardrail_refs:
          - KT-CPLX-002
          - KT-SEC-001
        tasks:
          - id: FS-031-T1
            status: done
            title: Persist daily closes from first purchase without a count window
            instructions:
              files:
                - domain/src/main/kotlin/com/pirlruc/finsilo/domain/usecase
                - domain/src/main/kotlin/com/pirlruc/finsilo/domain/market
            verification:
              - ./gradlew :domain:test
              - Bars before first BUY are not stored; a long series is not capped at 400
          - id: FS-031-T2
            status: done
            title: Load dashboard NAV and quotes for the selected range
            instructions:
              files:
                - app/src/main/java/com/pirlruc/finsilo/data
