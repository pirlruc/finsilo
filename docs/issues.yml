      - id: FS-034
        status: open
        title: Pin market HTTPS certificates
        overview:
          problem: >-
            Quote traffic is GET-only to four allowlisted hosts with system CAs.
            A compromised CA or hostile network can still MITM Alpha Vantage,
            CoinGecko, Frankfurter, or Stooq and feed false prices.
          goal: >-
            Decide whether to pin those hosts (and how pins rotate) before a
            public release, without blocking first-run quotes on pin expiry.
        decision: >-
          In the context of GET-only market HTTP, facing public CAs and an
          API-key query string, we decided keep the host allowlist now and
          treat certificate pinning as a release decision, to avoid shipping
          a pin set that cannot rotate, accepting MITM of quote data until
          pins land.
        architecture:
          target: OkHttp market client
          modules:
            - app/src/main/java/com/pirlruc/finsilo/data/remote
            - app/src/main/res/xml/network_security_config.xml
        acceptance_criteria:
          - A recorded pin set or an explicit decision to stay on system CAs
          - Pin failure fails closed for quotes and does not wipe the ledger
          - Rotation path is documented (backup pins or a documented unpin window)
        guardrail_refs:
          - KT-SEC-002
        tasks:
          - id: FS-034-T1
            status: open
            title: Choose pinning vs system CAs and implement or record the decision
            instructions:
              files:
                - app/src/main/java/com/pirlruc/finsilo/data/remote/HttpGetClient.kt
                - app/src/main/res/xml/network_security_config.xml
                - docs/issues.yml
            verification:
