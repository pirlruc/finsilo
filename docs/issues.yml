                - app/src/main/java/com/pirlruc/finsilo/data/sync
            verification:
              - ./gradlew :app:testDebugUnitTest
              - Changing 1M/3M/YTD/All reloads that window; sync does not triple-load
          - id: FS-031-T3
            status: done
            title: Hybrid SQLCipher eviction after 15 minutes in the background
            instructions:
              files:
