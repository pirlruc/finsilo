      - id: FS-029
        status: done
        title: Keep session UI across lock, fund buys, and fill the allocation pie
        overview:
          problem: >-
            Relock used the activity ON_STOP, so a notification-permission
            dialog unregistered the Activity Result launcher and crashed, and
            leaving the dashboard (or the app) discarded an in-progress ledger
            form. Manual buys still required a separate cash deposit. A single
            100% allocation slice rendered as a gapped donut.
          goal: >-
            Relock on process background, overlay the PIN screen without
            disposing the unlocked UI, auto-insert a same-day cash deposit when
            a buy exceeds uninvested cash, and draw a full pie for a single
            slice. Do not reopen FS-DEC-001: the cash guard still holds after
            the deposit+buy pair; TWR still treats same-day funded buys as
            internal.
        architecture:
          target: App lock overlay, funded ledger writes, allocation pie
          modules:
            - app/src/main/java/com/pirlruc/finsilo/ui/lock
            - app/src/main/java/com/pirlruc/finsilo/ui/ledger
