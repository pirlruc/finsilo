  - name: Phase 7 — Guardrails
    epics:
      - id: GATE-001
        status: open
        title: Wire Kotlin quality, coverage, and security gates
        overview:
          problem: >-
            Org Kotlin gates (ktlint, detekt, Kover 95/95, gitleaks, semgrep)
            were not wired. ktlint + detekt run locally and in CI (GATE-001-T1/T2).
            gitleaks + semgrep and Dokka/KDoc coverage are wired (T4/T5). Kover
            reads thresholds fail-closed (T3): line coverage is above 95%;
            branch coverage is still ~73% — see docs/limitations.md LIM-COV.
          goal: >-
            CI and local commands enforce KT-BUILD-002, KT-CPLX-001/002,
            KT-TEST-002, KT-DOC-001, KT-SEC-002/003, and CI-001…CI-012 without
            copying cppdevops job bodies. Kover 95/95 remains blocking once
            coverage catches up; do not record a fake lowered-gate deviation.
        architecture:
          target: Gradle modules plus GitHub Actions
          modules:
            - .github/workflows/domain-tests.yml
            - .github/workflows/quality.yml
            - .github/workflows/docs.yml
            - .github/workflows/security.yml
            - domain/build.gradle.kts
            - app/build.gradle.kts
            - config/kotlin.profile.thresholds.yml
            - scripts/ci-local.sh
            - docs/guardrails/kotlin/profile.thresholds.yml
        acceptance_criteria:
          - Domain unit tests run in CI with SHA-pinned actions
          - ktlint and detekt run locally and in CI on :domain (GATE-001-T2)
          - Kover reads statement_coverage and branch_coverage fail-closed
          - gitleaks and semgrep run on PRs; High/Critical (ERROR) fails the job
          - Dokka HTML + KDoc coverage read doc_coverage fail-closed
          - No fake deviation entry in docs/guardrail-deviations.yml
        guardrail_refs:
          - KT-BUILD-002
          - KT-CPLX-001
          - KT-CPLX-002
          - KT-TEST-002
          - KT-DOC-001
          - KT-SEC-002
          - KT-SEC-003
          - CI-001
          - CI-006
          - CI-010
          - CI-025
        tasks:
          - id: GATE-001-T1
            status: done
            title: Add SHA-pinned domain unit-test workflow
            instructions:
              files:
                - .github/workflows/domain-tests.yml
            verification:
