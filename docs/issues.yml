            verification:
              - ./gradlew :app:testDebugUnitTest --tests com.pirlruc.finsilo.ui.lock.LockViewModelTest
              - Overlay lock on background; session still open if foregrounded before 15 minutes; key wiped after grace

      - id: FS-032
        status: done
        title: Remove dead code and close lock/HTTP security bugs
        overview:
          problem: >-
            Unused chart-stepping and repository helpers remained after FS-031.
            HTTP errors embedded Alpha Vantage query strings, lock setup could
            mark PIN ready without SQLCipher wraps, recovery clipboard clear
            no-op'd on API 29+, and CSV import was unbounded.
          goal: >-
            Delete unused production paths, share rating/NAV/Keystore helpers,
            and fail closed on those security bugs without adding scanner
            suppressions.
        decision: >-
          In the context of a quality/security pass, facing unused APIs and
          dual-write lock bugs, we decided delete-first plus wrap-then-hash
          setup with recovery-wrap rollback, to reduce executed surface and
          keep lock and SQLCipher wraps consistent, accepting that FLAG_SECURE
          still drops while a system picker is open (FS-033).
        architecture:
          target: Domain market/lock plus app security and remote HTTP
          modules:
            - domain/src/main/kotlin/com/pirlruc/finsilo/domain
            - app/src/main/java/com/pirlruc/finsilo/data
            - app/src/main/java/com/pirlruc/finsilo/ui/lock
            - app/src/main/java/com/pirlruc/finsilo/data/remote
        acceptance_criteria:
