      - id: FS-027
        status: done
        title: Same-day ledger tie-break and PIN-wrapped SQLCipher
        overview:
          problem: >-
            Same-day FIFO still tie-breaks on UUID lexicographic order, so two
            trades on one date can replay in an order the user did not intend.
            The app lock is UI-only: SQLCipher is Keystore-backed, not wrapped
            by the PIN, which the setup screen already states.
          goal: >-
            Persist an explicit same-day order (created_at or import source line)
            used by PositionLedger instead of UUID text. Wrap the database
            passphrase with the PIN/recovery secret so a stolen ciphertext file
            is not readable without that secret. Do not reopen FS-DEC-001.
            Superseded in part by FS-030: a third biometric wrap now unwraps
            on a cold process, with PIN fallback.
        architecture:
          target: Transaction row identity plus PIN-wrapped DatabaseKeyStore
          modules:
            - domain/src/main/kotlin/com/pirlruc/finsilo/domain/portfolio
            - domain/src/main/kotlin/com/pirlruc/finsilo/domain/lock
            - app/src/main/java/com/pirlruc/finsilo/data/security
            - app/src/main/java/com/pirlruc/finsilo/data/local
            - app/src/main/java/com/pirlruc/finsilo/ui/lock
        acceptance_criteria:
          - Same-day replay order is stable without depending on UUID string sort
          - PIN-wrapped DB migrates existing installs without a silent wipe
          - Recovery rewraps the passphrase; biometric cold-start unwrap is FS-030
        guardrail_refs:
          - KT-SEC-001
        tasks:
          - id: FS-027-T1
            status: done
            title: Replace UUID lexicographic same-day FIFO tie-break
            instructions:
