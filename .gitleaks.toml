title = "FinSilo"

[extend]
useDefault = true

[[allowlists]]
description = "SharedPreferences names. These are not API credentials."
regexTarget = "secret"
regexes = [
  '''trading212_key''',
  '''trading212_secret''',
]

[[allowlists]]
description = "The sync test builds a generated PKCS8 marker at runtime. It is not a stored key."
paths = [
  '''app/src/test/java/com/pirlruc/finsilo/data/sync/ReadOnlyLedgerSyncTest\.kt''',
]
