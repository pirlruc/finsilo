# Consumer copy of docs/guardrails/kotlin/profile.thresholds.yml (submodule pin 1.8.0).
# CI inits docs/guardrails with GUARDRAILS_READ_TOKEN (not GITHUB_TOKEN). When the
# analog tree is present, scripts/read_kotlin_threshold.py requires every analog
# key to match this copy. .github/scaffold is not cloned in CI.
# KT-CPLX-002 forbids a Python-style maintainability index. Do not add one here.

statement_coverage: 95          # KT-TEST-002
branch_coverage: 95             # KT-TEST-002
doc_coverage: 95                # KT-DOC-001 Dokka documented visibility
max_cyclomatic_complexity: 10   # KT-CPLX-001
pr_size_soft_limit_lines: 500   # KT-DELIV-001
lint_exception_max_days: 14     # KT-BUILD-002
