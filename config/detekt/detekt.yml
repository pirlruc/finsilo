complexity:
  # KT-CPLX-001. detekt 2.x reports when complexity > allowedComplexity, so
  # allowedComplexity is the inclusive max (profile max_cyclomatic_complexity).
  # Composable is not ignored: UI complexity is gated here, not only by SEI MI.
  CyclomaticComplexMethod:
    active: true
    allowedComplexity: 10
  LongMethod:
    active: true
    allowedLines: 80
  LongParameterList:
    active: true
    allowedConstructorParameters: 12
    allowedFunctionParameters: 8
  TooManyFunctions:
    active: false
  ComplexCondition:
    active: false

style:
  MagicNumber:
    active: false
  WildcardImport:
    active: true
  ReturnCount:
    active: true
    max: 4
  ThrowsCount:
    max: 3
  MaxLineLength:
    active: false
  LoopWithTooManyJumpStatements:
    active: true
    maxJumpCount: 1
  UseCheckOrError:
    active: false

exceptions:
  TooGenericExceptionCaught:
    active: false

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
