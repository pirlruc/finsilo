name: docs

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    permissions:
      contents: read
    uses: pirlruc/commondevops/.github/workflows/common-doc-verify.yml@9350e95cbb130219be113d8737469cd7c39f155c # v6.11.0
    with:
      blocking: true
      scripts_ref: 9350e95cbb130219be113d8737469cd7c39f155c # v6.11.0
      shell_scripts: "scripts/*.sh"
      yaml_globs: ".github/workflows/*.yml docs/*.yml"
      run_markdownlint: true
      run_link_lint: true
    secrets:
      checkout_token: ${{ secrets.GITHUB_TOKEN }}
