name: docs

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kdoc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Init guardrails analog
        env:
          GUARDRAILS_READ_TOKEN: ${{ secrets.GUARDRAILS_READ_TOKEN }}
        run: bash scripts/ci-init-guardrails.sh

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Read doc coverage gate
        run: python3 scripts/read_kotlin_threshold.py doc_coverage

      - name: Generate Dokka HTML
        run: ./gradlew :domain:dokkaGenerate --stacktrace

      - name: Enforce KDoc coverage
        run: python3 scripts/check-kdoc-coverage.py
