name: docs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    permissions:
      contents: read
    uses: pirlruc/commondevops/.github/workflows/common-doc-verify.yml@1e0c029bf93705f399f2a3a7e5f19810c101da65
    with:
      blocking: true
      scripts_ref: 1e0c029bf93705f399f2a3a7e5f19810c101da65
      shell_scripts: "scripts/*.sh"
      yaml_globs: ".github/workflows/*.yml docs/*.yml"
      run_markdownlint: true
      run_link_lint: true
    secrets:
      checkout_token: ${{ secrets.GITHUB_TOKEN }}
