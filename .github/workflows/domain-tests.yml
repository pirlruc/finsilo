name: domain-tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: domain-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  domain-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Domain unit tests
        run: ./gradlew :domain:test :domain:koverLog --stacktrace

  kover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Init guardrails analog
        env:
          GUARDRAILS_READ_TOKEN: ${{ secrets.GUARDRAILS_READ_TOKEN }}
        run: bash scripts/ci-init-guardrails.sh

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Read coverage gates (fail closed)
        run: |
          python3 scripts/read_kotlin_threshold.py statement_coverage
          python3 scripts/read_kotlin_threshold.py branch_coverage

      - name: Kover verify
        run: ./gradlew :domain:koverVerify --stacktrace
