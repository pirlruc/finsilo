name: domain-tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: domain-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  domain:
    permissions:
      contents: read
    uses: pirlruc/androiddevops/.github/workflows/android-gradle-ci.yml@fb6651b3cd3246975df605e7000c4992d6b6a184
    with:
      scripts_ref: fb6651b3cd3246975df605e7000c4992d6b6a184
      java_version: "21"
      gradle_tasks: :domain:test :domain:koverVerify
    secrets:
      checkout_token: ${{ secrets.GITHUB_TOKEN }}
