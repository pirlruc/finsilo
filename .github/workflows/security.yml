name: security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    permissions:
      contents: read
    uses: pirlruc/commondevops/.github/workflows/common-secrets-sast.yml@1e0c029bf93705f399f2a3a7e5f19810c101da65
    with:
      blocking: true
      scripts_ref: 1e0c029bf93705f399f2a3a7e5f19810c101da65
    secrets:
      checkout_token: ${{ secrets.GITHUB_TOKEN }}

  supply-chain:
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
    uses: pirlruc/commondevops/.github/workflows/common-supply-chain.yml@1e0c029bf93705f399f2a3a7e5f19810c101da65
    with:
      blocking: true
      scripts_ref: 1e0c029bf93705f399f2a3a7e5f19810c101da65
      license_engine: spdx-deny
    secrets:
      checkout_token: ${{ secrets.GITHUB_TOKEN }}
