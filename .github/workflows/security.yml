name: security

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  secrets:
    permissions:
      contents: read
      packages: read
    uses: pirlruc/commondevops/.github/workflows/common-secrets-sast.yml@9350e95cbb130219be113d8737469cd7c39f155c # v6.11.0
    with:
      blocking: true
      scripts_ref: 9350e95cbb130219be113d8737469cd7c39f155c # v6.11.0

  supply-chain:
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
    uses: pirlruc/commondevops/.github/workflows/common-supply-chain.yml@9350e95cbb130219be113d8737469cd7c39f155c # v6.11.0
    with:
      blocking: true
      scripts_ref: 9350e95cbb130219be113d8737469cd7c39f155c # v6.11.0
      license_engine: spdx-deny
