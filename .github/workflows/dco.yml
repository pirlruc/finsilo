name: dco

on:
  pull_request:

permissions: {}

jobs:
  DCO:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require a Developer Certificate of Origin
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          missing=0
          for sha in $(git rev-list "${BASE_SHA}..HEAD"); do
            parents=$(git rev-list --parents -n 1 "$sha" | wc -w)
            if [ "$parents" -gt 2 ]; then
              continue
            fi
            author=$(git log -1 --format=%an "$sha")
            if [ "$author" = "dependabot[bot]" ]; then
              continue
            fi
            if ! git log -1 --format=%B "$sha" | grep -q '^Signed-off-by: '; then
              echo "missing Signed-off-by on $sha"
              missing=1
            fi
          done
          exit "$missing"
