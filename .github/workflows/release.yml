# Builds a release APK and publishes the GitHub Release for an annotated tag.
# The release environment holds the keystore. A caller job that uses a
# reusable workflow cannot set environment (GitHub rejects that file).
# android-release-apk and common-release select the environment themselves.
name: release

on:
  push:
    tags: ["[0-9]*"]

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  tag:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Accept only a semver tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "refusing tag"
            exit 1
          fi

  apk:
    needs: tag
    permissions:
      contents: read
    uses: pirlruc/androiddevops/.github/workflows/android-release-apk.yml@642655907a2cfd8cfbe717bf4294a26289f37d22 # 1.12.1
    with:
      scripts_ref: 642655907a2cfd8cfbe717bf4294a26289f37d22 # 1.12.1
      java_version: "21"
      allow_unsigned: false
      environment: release
    secrets:
      checkout_token: ${{ secrets.GITHUB_TOKEN }}
      keystore_base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      keystore_password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      key_alias: ${{ secrets.ANDROID_KEY_ALIAS }}
      key_password: ${{ secrets.ANDROID_KEY_PASSWORD }}

  publish:
    needs: apk
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: pirlruc/commondevops/.github/workflows/common-release-sign.yml@9350e95cbb130219be113d8737469cd7c39f155c # v6.11.0
    with:
      tag: ${{ github.ref_name }}
      attach_sbom: false
      sign: true
      environment: release
      release_artifact: android-release-apk
    secrets:
      release_token: ${{ secrets.RELEASE_TOKEN }}
