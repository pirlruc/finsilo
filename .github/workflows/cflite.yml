name: cflite

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 1 * *"

concurrency:
  group: cflite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  fuzz:
    permissions:
      contents: read
    uses: pirlruc/androiddevops/.github/workflows/android-jvm-fuzz.yml@29b91430c9c55f84ad05575bd0b2267ed30096d2 # 1.12.0
    with:
      gradle_args: ":domain:test --tests com.pirlruc.finsilo.domain.importcsv.BrokerCsvFuzzTest --tests com.pirlruc.finsilo.domain.importcsv.ReadOnlyBrokerTest"
      java_version: "21"
      fuzz_iterations: "200"

  seeded:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Seeded parser fuzz
        env:
          FINSILO_FUZZ_ITERATIONS: "200"
        run: ./gradlew :domain:test --tests com.pirlruc.finsilo.domain.importcsv.BrokerCsvFuzzTest --tests com.pirlruc.finsilo.domain.importcsv.ReadOnlyBrokerTest
