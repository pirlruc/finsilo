name: cflite

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 1 * *"

concurrency:
  group: cflite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  fuzz:
    permissions:
      contents: read
    uses: pirlruc/androiddevops/.github/workflows/android-jvm-fuzz.yml@642655907a2cfd8cfbe717bf4294a26289f37d22 # 1.12.1
    with:
      gradle_args: ":domain:test --tests com.pirlruc.finsilo.domain.importcsv.BrokerCsvFuzzTest --tests com.pirlruc.finsilo.domain.importcsv.ReadOnlyBrokerTest"
      java_version: "21"
      fuzz_iterations: "200"

  seeded:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Seeded parser fuzz
        env:
          FINSILO_FUZZ_ITERATIONS: "200"
        run: ./gradlew :domain:test --tests com.pirlruc.finsilo.domain.importcsv.BrokerCsvFuzzTest --tests com.pirlruc.finsilo.domain.importcsv.ReadOnlyBrokerTest
