name: jazzer

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 1 * *"

concurrency:
  group: jazzer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  fuzz:
    permissions:
      contents: read
    uses: pirlruc/androiddevops/.github/workflows/android-jvm-fuzz.yml@642655907a2cfd8cfbe717bf4294a26289f37d22 # 1.12.1
    with:
      gradle_args: ":domain:test --tests com.pirlruc.finsilo.domain.importcsv.BrokerCsvFuzzTest"
      java_version: "21"
      fuzz_iterations: "200"
