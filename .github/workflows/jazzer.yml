name: jazzer

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 1 * *"

concurrency:
  group: jazzer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  fuzz:
    permissions:
      contents: read
    uses: pirlruc/androiddevops/.github/workflows/android-jvm-fuzz.yml@29b91430c9c55f84ad05575bd0b2267ed30096d2 # 1.12.0
    with:
      gradle_args: ":domain:test --tests com.pirlruc.finsilo.domain.importcsv.BrokerCsvFuzzTest"
      java_version: "21"
      fuzz_iterations: "200"
