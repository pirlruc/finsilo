name: emulator

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

concurrency:
  group: emulator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  emulator:
    permissions:
      contents: read
    uses: pirlruc/androiddevops/.github/workflows/android-emulator.yml@642655907a2cfd8cfbe717bf4294a26289f37d22 # 1.12.1
    with:
      scripts_ref: 642655907a2cfd8cfbe717bf4294a26289f37d22 # 1.12.1
      java_version: "21"
      script: ./gradlew :app:testDebugUnitTest
    secrets:
      checkout_token: ${{ secrets.GITHUB_TOKEN }}
