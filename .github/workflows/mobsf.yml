name: mobsf

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: mobsf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  mobsf:
    permissions:
      contents: read
    uses: pirlruc/androiddevops/.github/workflows/android-mobsf.yml@642655907a2cfd8cfbe717bf4294a26289f37d22 # 1.12.1
    with:
      scripts_ref: 642655907a2cfd8cfbe717bf4294a26289f37d22 # 1.12.1
      source_paths: app/src/main domain/src/main
    secrets:
      checkout_token: ${{ secrets.GITHUB_TOKEN }}
