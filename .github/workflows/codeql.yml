name: codeql

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  codeql:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: pirlruc/androiddevops/.github/workflows/android-codeql.yml@642655907a2cfd8cfbe717bf4294a26289f37d22 # 1.12.1
    with:
      scripts_ref: 642655907a2cfd8cfbe717bf4294a26289f37d22 # 1.12.1
      java_version: "21"
      build_command: ./gradlew --no-daemon --rerun-tasks :domain:compileKotlin :app:compileDebugKotlin
    secrets:
      checkout_token: ${{ secrets.GITHUB_TOKEN }}
