name: quality

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wrapper:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Gradle wrapper validation
        uses: gradle/actions/wrapper-validation@18f1c6724d5bcb313b5c5ef536430a31e5c5b455 # v4.4.0

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # Do not set submodules: recursive — that would also clone
          # .github/scaffold, which CI does not need (templates are synced).

      - name: Init guardrails analog
        env:
          GUARDRAILS_READ_TOKEN: ${{ secrets.GUARDRAILS_READ_TOKEN }}
        run: bash scripts/ci-init-guardrails.sh

      - name: Set up JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Complexity gate matches profile (fail closed)
        run: python3 scripts/check-detekt-complexity.py

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Maintainability index (domain + app SEI)
        run: |
          pip install --disable-pip-version-check "multimetric==2.4.4"
          python3 scripts/check-maintainability.py

      - name: Kotlin format and detekt
        run: ./gradlew :domain:ktlintCheck :domain:detekt :app:ktlintCheck :app:detekt --stacktrace
