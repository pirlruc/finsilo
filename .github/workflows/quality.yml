name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  pins:
    permissions:
      contents: read
    uses: pirlruc/commondevops/.github/workflows/common-pins-verify.yml@1e0c029bf93705f399f2a3a7e5f19810c101da65
    with:
      scripts_ref: 1e0c029bf93705f399f2a3a7e5f19810c101da65
      pin_script: scripts/check-analog-pins.sh

  drift:
    permissions:
      contents: read
    uses: pirlruc/commondevops/.github/workflows/common-threshold-drift.yml@1e0c029bf93705f399f2a3a7e5f19810c101da65
    with:
      scripts_ref: 1e0c029bf93705f399f2a3a7e5f19810c101da65
      drift_script: scripts/check-threshold-drift.sh
    secrets:
      checkout_token: ${{ secrets.GUARDRAILS_READ_TOKEN }}

  scaffold:
    permissions:
      contents: read
      issues: read
    uses: pirlruc/commondevops/.github/workflows/common-scaffold-verify.yml@1e0c029bf93705f399f2a3a7e5f19810c101da65
    with:
      blocking: true
      scripts_ref: 1e0c029bf93705f399f2a3a7e5f19810c101da65
    secrets:
      packs_token: ${{ secrets.GUARDRAILS_READ_TOKEN }}

  tokens:
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
    uses: pirlruc/commondevops/.github/workflows/common-token-audit.yml@1e0c029bf93705f399f2a3a7e5f19810c101da65
    with:
      scripts_ref: 1e0c029bf93705f399f2a3a7e5f19810c101da65
    secrets:
      guardrails_token: ${{ secrets.GUARDRAILS_READ_TOKEN }}

  guardrails-analog:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - name: Clone analog and compare Kotlin keys
        env:
          GUARDRAILS_READ_TOKEN: ${{ secrets.GUARDRAILS_READ_TOKEN }}
        run: |
          bash scripts/ci-init-guardrails.sh
          python3 scripts/read_kotlin_threshold.py statement_coverage
          python3 scripts/read_kotlin_threshold.py branch_coverage
