name: sbom

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: sbom-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  sbom:
    permissions:
      contents: read
    # actionlint does not parse GitHub's $/ self-repository form yet.
    # actionlint-disable:workflow-call
    uses: $/.github/workflows/sbom-reusable.yml
