name: sbom

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: sbom-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  sbom:
    permissions:
      contents: read
    uses: pirlruc/androiddevops/.github/workflows/android-apk-sbom.yml@29b91430c9c55f84ad05575bd0b2267ed30096d2 # 1.12.0
    with:
      scripts_ref: 29b91430c9c55f84ad05575bd0b2267ed30096d2 # 1.12.0
      java_version: "21"
    secrets:
      checkout_token: ${{ secrets.GITHUB_TOKEN }}
