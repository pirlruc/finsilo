name: android

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  gradle:
    permissions:
      contents: read
    uses: pirlruc/androiddevops/.github/workflows/android-gradle-ci.yml@29b91430c9c55f84ad05575bd0b2267ed30096d2 # 1.12.0
    with:
      scripts_ref: 29b91430c9c55f84ad05575bd0b2267ed30096d2 # 1.12.0
      java_version: "21"
      gradle_tasks: >-
        :domain:test :domain:koverVerify
        :app:lintDebug :app:testDebugUnitTest :app:koverVerifyDebug :app:assembleDebug
      guardrail_checks: false
    secrets:
      checkout_token: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: pirlruc/androiddevops/.github/workflows/android-codeql.yml@29b91430c9c55f84ad05575bd0b2267ed30096d2 # 1.12.0
    with:
      scripts_ref: 29b91430c9c55f84ad05575bd0b2267ed30096d2 # 1.12.0
      java_version: "21"
      build_command: ./gradlew --no-daemon --rerun-tasks :domain:compileKotlin :app:compileDebugKotlin
    secrets:
      checkout_token: ${{ secrets.GITHUB_TOKEN }}

  mobsf:
    permissions:
      contents: read
    uses: pirlruc/androiddevops/.github/workflows/android-mobsf.yml@29b91430c9c55f84ad05575bd0b2267ed30096d2 # 1.12.0
    with:
      scripts_ref: 29b91430c9c55f84ad05575bd0b2267ed30096d2 # 1.12.0
      source_paths: app/src/main domain/src/main
    secrets:
      checkout_token: ${{ secrets.GITHUB_TOKEN }}

  sbom:
    permissions:
      contents: read
    uses: pirlruc/androiddevops/.github/workflows/android-apk-sbom.yml@29b91430c9c55f84ad05575bd0b2267ed30096d2 # 1.12.0
    with:
      scripts_ref: 29b91430c9c55f84ad05575bd0b2267ed30096d2 # 1.12.0
      java_version: "21"
    secrets:
      checkout_token: ${{ secrets.GITHUB_TOKEN }}
