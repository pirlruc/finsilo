name: android

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  gradle:
    permissions:
      contents: read
    uses: pirlruc/androiddevops/.github/workflows/android-gradle-ci.yml@642655907a2cfd8cfbe717bf4294a26289f37d22 # 1.12.1
    with:
      scripts_ref: 642655907a2cfd8cfbe717bf4294a26289f37d22 # 1.12.1
      java_version: "21"
      gradle_tasks: >-
        :domain:test :domain:koverVerify
        :app:lintDebug :app:testDebugUnitTest :app:koverVerifyDebug :app:assembleDebug
      guardrail_checks: false
    secrets:
      checkout_token: ${{ secrets.GITHUB_TOKEN }}
