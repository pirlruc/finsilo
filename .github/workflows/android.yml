name: android

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gradle:
    permissions:
      contents: read
    uses: pirlruc/androiddevops/.github/workflows/android-gradle-ci.yml@fb6651b3cd3246975df605e7000c4992d6b6a184
    with:
      scripts_ref: fb6651b3cd3246975df605e7000c4992d6b6a184
      java_version: "21"
      gradle_tasks: >-
        :domain:test :domain:koverVerify
        :app:lintDebug :app:testDebugUnitTest :app:koverVerifyDebug :app:assembleDebug
      guardrail_checks: false
    secrets:
      checkout_token: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    permissions:
      contents: read
      security-events: write
    uses: pirlruc/androiddevops/.github/workflows/android-codeql.yml@fb6651b3cd3246975df605e7000c4992d6b6a184
    with:
      scripts_ref: fb6651b3cd3246975df605e7000c4992d6b6a184
      java_version: "21"
      build_command: ./gradlew :app:assembleDebug --no-daemon
    secrets:
      checkout_token: ${{ secrets.GITHUB_TOKEN }}

  mobsf:
    permissions:
      contents: read
    uses: pirlruc/androiddevops/.github/workflows/android-mobsf.yml@fb6651b3cd3246975df605e7000c4992d6b6a184
    with:
      scripts_ref: fb6651b3cd3246975df605e7000c4992d6b6a184
      source_paths: app/src/main domain/src/main
    secrets:
      checkout_token: ${{ secrets.GITHUB_TOKEN }}

  sbom:
    permissions:
      contents: read
    uses: pirlruc/androiddevops/.github/workflows/android-apk-sbom.yml@fb6651b3cd3246975df605e7000c4992d6b6a184
    with:
      scripts_ref: fb6651b3cd3246975df605e7000c4992d6b6a184
      java_version: "21"
    secrets:
      checkout_token: ${{ secrets.GITHUB_TOKEN }}
