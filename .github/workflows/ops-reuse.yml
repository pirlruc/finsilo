name: ops-reuse

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ops-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  infra:
    permissions:
      contents: read
      packages: read
    uses: pirlruc/commondevops/.github/workflows/common-infra-lint.yml@9350e95cbb130219be113d8737469cd7c39f155c # v6.11.0
    with:
      blocking: true
      scripts_ref: 9350e95cbb130219be113d8737469cd7c39f155c # v6.11.0
      shell_scripts: "scripts/*.sh"

  dependency-review:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    uses: pirlruc/commondevops/.github/workflows/common-dependency-review.yml@9350e95cbb130219be113d8737469cd7c39f155c # v6.11.0

  scorecard:
    permissions:
      contents: read
      actions: read
      id-token: write
      security-events: write
    uses: pirlruc/commondevops/.github/workflows/common-scorecard.yml@9350e95cbb130219be113d8737469cd7c39f155c # v6.11.0
    with:
      blocking: false
      publish_results: false

  sweep:
    permissions:
      actions: write
    uses: pirlruc/commondevops/.github/workflows/artifact-sweep.yml@9350e95cbb130219be113d8737469cd7c39f155c # v6.11.0
