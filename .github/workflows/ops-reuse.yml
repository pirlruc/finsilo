name: ops-reuse

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  infra:
    permissions:
      contents: read
      packages: read
    uses: pirlruc/commondevops/.github/workflows/common-infra-lint.yml@1e0c029bf93705f399f2a3a7e5f19810c101da65
    with:
      blocking: true
      scripts_ref: 1e0c029bf93705f399f2a3a7e5f19810c101da65
      shell_scripts: scripts
    secrets:
      checkout_token: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    uses: pirlruc/commondevops/.github/workflows/common-dependency-review.yml@1e0c029bf93705f399f2a3a7e5f19810c101da65

  scorecard:
    permissions:
      contents: read
      actions: read
      id-token: write
      security-events: write
    uses: pirlruc/commondevops/.github/workflows/common-scorecard.yml@1e0c029bf93705f399f2a3a7e5f19810c101da65
    with:
      blocking: false
      publish_results: false
