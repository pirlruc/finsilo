name: ops reuse

# Thin callers for language-agnostic jobs in pirlruc/commondevops (CI-018, CI-019).
# Pin and scripts_ref are the same commit (CI-034): tag 5.1.2.
# COMMONDEVOPS_READ_TOKEN checks out that private repo. The same pattern is what
# a private FinSilo needs; do not switch these jobs to GITHUB_TOKEN.
# commondevops must allow Actions access from this repository. The token does
# not grant that workflow fetch.
# Jobs that do not fit stay local: p/kotlin semgrep, Gradle CycloneDX grype,
# cppdevops, pydevops, containerdevops.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ops-reuse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  infra:
    # CI-024: Dependabot cannot read Actions secrets or this private workflow.
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
    uses: pirlruc/commondevops/.github/workflows/common-infra-lint.yml@b3c462bed0de4f6475e6be7875c4ababd831acc6
    with:
      blocking: true
      scripts_ref: b3c462bed0de4f6475e6be7875c4ababd831acc6
    secrets:
      checkout_token: ${{ secrets.COMMONDEVOPS_READ_TOKEN }}

  docs:
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
    uses: pirlruc/commondevops/.github/workflows/common-doc-verify.yml@b3c462bed0de4f6475e6be7875c4ababd831acc6
    with:
      blocking: true
      scripts_ref: b3c462bed0de4f6475e6be7875c4ababd831acc6
      # ShellCheck runs in infra. This repo has no scripts/validate-yaml.py.
      # Ruff is a Python-package gate; these scripts are CI helpers.
      run_link_lint: true
    secrets:
      checkout_token: ${{ secrets.COMMONDEVOPS_READ_TOKEN }}

  scaffold:
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
    uses: pirlruc/commondevops/.github/workflows/common-scaffold-verify.yml@b3c462bed0de4f6475e6be7875c4ababd831acc6
    with:
      blocking: true
      scripts_ref: b3c462bed0de4f6475e6be7875c4ababd831acc6

  scorecard:
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      id-token: write
      security-events: write
    uses: pirlruc/commondevops/.github/workflows/common-scorecard.yml@b3c462bed0de4f6475e6be7875c4ababd831acc6
    with:
      blocking: true
      # Publish only while this repository is public. A later private switch
      # must not send results to the OpenSSF API.
      publish_results: ${{ github.event.repository.visibility == 'public' }}
    secrets:
      # Private Scorecard needs a PAT that can read THIS repository (ListCommits).
      # Reuse the commondevops token only when that PAT also includes FinSilo.
      repo_token: ${{ secrets.COMMONDEVOPS_READ_TOKEN }}
