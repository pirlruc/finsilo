# Org-default Dependabot (SC-DEP-001/002/003/005).
# Seeded once into .github/dependabot.yml by sync-templates.sh — never overwritten.
# Cadence and open-PR limit: docs/guardrails/supply-chain/profile.thresholds.yml
# Process: https://github.com/pirlruc/methodologies/blob/1.7.0/github-issue-adr/docs/process/dependency-updates.md
#
# DEPENDABOT_GITHUB_TOKEN is a Dependabot secret (Settings → Secrets and
# variables → Dependabot). It is not an Actions secret. Actions jobs cannot
# read it, and this file cannot reveal whether the PAT can open a given repo.
#
# Attach github-private only to ecosystems that clone private git:
# github-actions (private reusable workflows, if any) and gitsubmodule
# (docs/guardrails, .github/scaffold). gradle and pre-commit stay off it.
# A git registry on some ecosystems fails the update with unexpected_external_code.
#
# dhi.io stays commented. This repo has no docker ecosystem.
#
# registries:
#   dhi:
#     type: docker-registry
#     url: https://dhi.io
#     username: ${{secrets.DOCKERHUB_USERNAME}}
#     password: ${{secrets.DOCKERHUB_TOKEN}}

version: 2

registries:
  github-private:
    type: git
    url: https://github.com
    username: x-access-token
    password: ${{secrets.DEPENDABOT_GITHUB_TOKEN}}

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Lisbon
    commit-message:
      prefix: build
      include: scope

updates:
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
    registries:
      - github-private
  - package-ecosystem: gradle
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
  - package-ecosystem: pre-commit
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
  - package-ecosystem: gitsubmodule
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
    registries:
      - github-private
